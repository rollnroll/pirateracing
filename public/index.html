<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиратская Дуэль на Кубиках - PvP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #d35400;
        }
        #status {
            margin-top: 15px;
            font-style: italic;
            color: #bdc3c7;
        }
        .log {
            margin-top: 20px;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏴‍☠️ Пиратская Дуэль</h2>
        <div id="connection-status">Подключение к серверу...</div>
        
        <div style="margin-top: 20px;">
            <button id="roll-btn" onclick="rollDice()" disabled>Бросить кубик</button>
        </div>

        <div id="status">Ждем хода...</div>

        <div class="log" id="log">
            <div>Лог событий:</div>
        </div>
    </div>

    <!-- Подключаем библиотеку Socket.io, которую раздает наш сервер -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Подключаемся к серверу на Render (автоматически определяет текущий домен)
        const socket = io();

        const statusEl = document.getElementById('connection-status');
        const rollBtn = document.getElementById('roll-btn');
        const gameStatusEl = document.getElementById('status');
        const logEl = document.getElementById('log');

        function addLog(text) {
            const div = document.createElement('div');
            div.textContent = `> ${text}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Успешное подключение к серверу
        socket.on('connect', () => {
            statusEl.textContent = "🟢 Подключено к серверу";
            statusEl.style.color = "#2ecc71";
            rollBtn.disabled = false;
            addLog(`Подключились с ID: ${socket.id}`);
        });

        // Отключение от сервера
        socket.on('disconnect', () => {
            statusEl.textContent = "🔴 Нет соединения с сервером";
            statusEl.style.color = "#e74c3c";
            rollBtn.disabled = true;
            addLog("Соединение потеряно.");
        });

        // Функция броска кубика
        function rollDice() {
            const result = Math.floor(Math.random() * 6) + 1;
            gameStatusEl.textContent = `Вы выбросили: ${result}`;
            addLog(`Вы сделали ход: выпало ${result}`);

            // Отправляем результат на сервер, чтобы он переслал его сопернику
            socket.emit('roll_dice', { result: result });
        }

        // Получаем ход от соперника через сервер
        socket.on('opponent_rolled', (data) => {
            gameStatusEl.textContent = `Соперник выбросил: ${data.result}`;
            addLog(`Соперник сделал ход: выпало ${data.result}`);
        });

        let currentRoom = null;

socket.on('start_game', (data) => {
    currentRoom = data.room;
    gameStatusEl.textContent = data.message;
    addLog(data.message);
    rollBtn.disabled = false; // Активируем кнопку
});

function rollDice() {
    const result = Math.floor(Math.random() * 6) + 1;
    gameStatusEl.textContent = `Вы выбросили: ${result}. Ждем ход соперника.`;
    addLog(`Вы сделали ход: выпало ${result}`);
    
    rollBtn.disabled = true; // Блокируем кнопку до ответа соперника (по желанию)

    // Передаем результат и комнату на сервер
    socket.emit('roll_dice', { room: currentRoom, result: result });
}

socket.on('opponent_rolled', (data) => {
    gameStatusEl.textContent = `Соперник выбросил: ${data.result}. Ваш ход!`;
    addLog(`Соперник сделал ход: выпало ${data.result}`);
    rollBtn.disabled = false; // Снова даем возможность ходить
});
    </script>

</body>
</html>
