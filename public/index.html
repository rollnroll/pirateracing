<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиратская Дуэль - Комнаты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #d35400;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-style: italic;
            color: #bdc3c7;
        }
        .log {
            margin-top: 20px;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏴‍☠️ Пиратская Дуэль (Комнаты)</h2>
        <div id="connection-status">Подключение к серверу...</div>
        
        <div style="margin-top: 20px;">
            <button id="roll-btn" onclick="rollDice()" disabled>Бросить кубик</button>
        </div>

        <div id="status">Ожидание подключения...</div>

        <div class="log" id="log">
            <div>Лог событий:</div>
        </div>
    </div>

    <!-- Подключаем библиотеку Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const statusEl = document.getElementById('connection-status');
        const rollBtn = document.getElementById('roll-btn');
        const gameStatusEl = document.getElementById('status');
        const logEl = document.getElementById('log');

        let currentRoom = null; // Переменная для хранения нашей игровой комнаты

        function addLog(text) {
            const div = document.createElement('div');
            div.textContent = `> ${text}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // 1. Успешное подключение к серверу
        socket.on('connect', () => {
            statusEl.textContent = "🟢 Подключено к серверу";
            statusEl.style.color = "#2ecc71";
            addLog(`Подключились с ID: ${socket.id}`);
        });

        // 2. Отключение от сервера
        socket.on('disconnect', () => {
            statusEl.textContent = "🔴 Нет соединения с сервером";
            statusEl.style.color = "#e74c3c";
            rollBtn.disabled = true;
            addLog("Соединение потеряно.");
        });

        // 3. Статус от сервера (например, "Ожидание второго игрока...")
        socket.on('game_status', (msg) => {
            gameStatusEl.textContent = msg;
            addLog(msg);
            rollBtn.disabled = true; // Пока ждем соперника, бросать нельзя
        });

        // 4. Соперник найден, игра начинается!
        socket.on('start_game', (data) => {
            currentRoom = data.room; // Сохраняем комнату
            gameStatusEl.textContent = data.message;
            addLog(`Комната получена: ${data.room}`);
            addLog(data.message);
            rollBtn.disabled = false; // Разрешаем ходить
        });

        // 5. Функция броска кубика
        function rollDice() {
            if (!currentRoom) return;

            const result = Math.floor(Math.random() * 6) + 1;
            gameStatusEl.textContent = `Вы выбросили: ${result}. Ждем ход соперника.`;
            addLog(`Вы сделали ход: выпало ${result}`);
            
            rollBtn.disabled = true; // Блокируем кнопку после своего хода

            // Отправляем результат и комнату на сервер
            socket.emit('roll_dice', { room: currentRoom, result: result });
        }

        // 6. Получаем ход от соперника
        socket.on('opponent_rolled', (data) => {
            gameStatusEl.textContent = `Соперник выбросил: ${data.result}. Ваш ход!`;
            addLog(`Соперник сделал ход: выпало ${data.result}`);
            rollBtn.disabled = false; // Снова разблокируем кнопку
        });
    </script>

</body>
</html>
