<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиратская Дуэль</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #d35400;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        button.secondary {
            background-color: #2980b9;
        }
        button.secondary:hover {
            background-color: #1f618d;
        }
        #status {
            margin-top: 15px;
            font-style: italic;
            color: #bdc3c7;
        }
        .log {
            margin-top: 20px;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏴‍☠️ Пиратская Дуэль</h2>
        <!-- Добавили цифровое обозначение игроков сюда -->
        <div id="connection-status" style="font-size: 13px; margin-bottom: 15px;">Подключение к серверу...</div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="menu-screen" class="screen active">
            <h3>Главное меню</h3>
            <button onclick="findPvP()">⚔️ Сразиться с игроком (PvP)</button>
            <button class="secondary" id="pve-btn" onclick="startPvE()">🤖 Тренировка с ботом (PvE)</button>
            <div id="menu-status" style="margin-top: 15px; font-size: 14px; color: #f1c40f;"></div>
        </div>

        <!-- ИГРОВОЙ ЭКРАН -->
        <div id="game-screen" class="screen">
            <div id="mode-badge" style="background: #e67e22; padding: 5px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 10px;"></div>
            
            <div style="margin-top: 10px;">
                <button id="roll-btn" onclick="rollDice()" disabled>Бросить кубик</button>
            </div>

            <div id="status">Ожидание...</div>

            <div class="log" id="log">
                <div>Лог событий:</div>
            </div>
            
            <button class="secondary" onclick="returnToMenu()" style="margin-top: 15px; background: #c0392b;">В меню</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const connectionStatusEl = document.getElementById('connection-status');
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const menuStatusEl = document.getElementById('menu-status');
        const pveBtn = document.getElementById('pve-btn');
        
        const rollBtn = document.getElementById('roll-btn');
        const gameStatusEl = document.getElementById('status');
        const modeBadgeEl = document.getElementById('mode-badge');
        const logEl = document.getElementById('log');

        let currentRoom = null;
        let isPvE = false;
        let lastKnownPlayers = 1;

        function addLog(text) {
            const div = document.createElement('div');
            div.textContent = `> ${text}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        socket.on('connect', () => {
            connectionStatusEl.textContent = `🟢 Подключено (Онлайн: ${lastKnownPlayers})`;
            connectionStatusEl.style.color = "#2ecc71";
        });

        socket.on('disconnect', () => {
            connectionStatusEl.textContent = "🔴 Нет соединения";
            connectionStatusEl.style.color = "#e74c3c";
        });

        socket.on('global_state', (data) => {
            lastKnownPlayers = data.totalPlayers;
            connectionStatusEl.textContent = `🟢 Подключено (Онлайн: ${data.totalPlayers})`;
            connectionStatusEl.style.color = "#2ecc71";

            if (!gameScreen.classList.contains('active')) {
                if (data.disablePve) {
                    pveBtn.disabled = true;
                    pveBtn.title = "Режим тренировки заблокирован: есть игроки в сети";
                    if (data.waitingCount > 0) {
                        menuStatusEl.textContent = "Игрок ждет в очереди PvP! Нажмите PvP для начала дуэли.";
                    } else {
                        menuStatusEl.textContent = `Игроков онлайн: ${data.totalPlayers}. Доступна только Дуэль.`;
                    }
                } else {
                    pveBtn.disabled = false;
                    pveBtn.title = "";
                    menuStatusEl.textContent = "Вы один на сервере. Можете тренироваться или ждать соперника.";
                }
            } else if (isPvE) {
                if (data.totalPlayers > 1) {
                    gameStatusEl.textContent = "Внимание: на сервере появился игрок! Нажмите PvP на другом клиенте для старта дуэли.";
                }
            }
        });

        function findPvP() {
            menuStatusEl.textContent = "Ищем живого соперника...";
            pveBtn.disabled = true;
            socket.emit('start_pvp');
        }

        socket.on('game_status', (msg) => {
            menuStatusEl.textContent = msg;
        });

        function startPvE() {
            isPvE = true;
            socket.emit('start_pve');
        }

        socket.on('pve_started', (data) => {
            menuScreen.classList.remove('active');
            gameScreen.classList.add('active');
            modeBadgeEl.textContent = "РЕЖИМ: ТРЕНИРОВКА С БОТОМ (РАЗМИНКА)";
            gameStatusEl.textContent = "Ваш ход против бота! Ждем оппонента...";
            rollBtn.disabled = false;
            addLog(data.message);
        });

        socket.on('switch_to_pvp', (data) => {
            currentRoom = data.room;
            isPvE = false;
            
            menuScreen.classList.remove('active');
            gameScreen.classList.add('active');
            modeBadgeEl.textContent = "РЕЖИМ: PvP ДУЭЛЬ";
            modeBadgeEl.style.background = "#c0392b";
            
            addLog(data.message);
            
            const isMyTurn = (data.currentTurn === socket.id);
            gameStatusEl.textContent = isMyTurn ? "Соперник найден! Ваш ход." : "Соперник найден! Ждите ход соперника.";
            rollBtn.disabled = !isMyTurn;
        });

        function rollDice() {
            const result = Math.floor(Math.random() * 6) + 1;
            rollBtn.disabled = true;

            if (isPvE) {
                addLog(`Вы выбросили: ${result}`);
                gameStatusEl.textContent = `Вы выбросили: ${result}. Ход бота...`;
                
                setTimeout(() => {
                    const botResult = Math.floor(Math.random() * 6) + 1;
                    addLog(`Бот выбросил: ${botResult}`);
                    gameStatusEl.textContent = `Бот выбросил: ${botResult}. Ваш ход!`;
                    rollBtn.disabled = false;
                }, 1000);
            } else {
                socket.emit('roll_dice', { room: currentRoom, result: result });
            }
        }

        socket.on('turn_result', (data) => {
            const isMyRoll = (data.rollerId === socket.id);

            if (isMyRoll) {
                gameStatusEl.textContent = `Вы выбросили: ${data.result}. Ждем ход соперника.`;
                addLog(`Вы сделали ход: выпало ${data.result}`);
            } else {
                gameStatusEl.textContent = `Соперник выбросил: ${data.result}. Ваш ход!`;
                addLog(`Соперник сделал ход: выпало ${data.result}`);
            }

            const isMyTurn = (data.nextTurn === socket.id);
            rollBtn.disabled = !isMyTurn;
        });

        socket.on('opponent_disconnected', (data) => {
            addLog(data.message);
            gameStatusEl.textContent = "Соперник покинул бой.";
            rollBtn.disabled = true;
            
            setTimeout(() => {
                window.location.reload();
            }, 3000);
        });

        function returnToMenu() {
            window.location.reload();
        }
    </script>

</body>
</html>
