<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиратская Дуэль</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f141c;
            color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .game-container {
            width: 100%;
            max-width: 420px;
            background: #182232;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 2px solid #2a3b55;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ffcc00;
        }
        p {
            font-size: 16px;
            color: #e2e8f0;
            margin: 20px 0;
        }
        button {
            background-color: #d97706;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏴‍☠️ Пиратская Дуэль</h1>
        <p id="text">Тест запуска в Telegram Mini App</p>
        <button onclick="handleClick()">Нажми меня</button>
    </div>

    <script>
        let count = 0;
        function handleClick() {
            count++;
            document.getElementById('text').textContent = "Кликов: " + count;
        }
    </script>
</body>
</html>
